<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="mount-icon-192.png">
    <meta name="theme-color" content="#0b5c7a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PinPoint Bowling">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <script src="pwa.js" defer></script>
</head>

<body class="login-page">
    <div class="auth-shell">
        <section class="auth-hero">
            <span class="eyebrow">PinPoint Bowling</span>
            <h1>Mount St. Mary's University Women's Bowling</h1>
            <p>A student developed application to store everything Mount Bowling!</p>
            <img class="auth-hero-image" src="mount-logo.svg" alt="Mount Bowling Logo">
        </section>

        <section class="auth-card">
            <div class="auth-toggle">
                <button class="auth-tab active" id="loginTab" type="button" onclick="setMode('login')">Login</button>
                <button class="auth-tab" id="registerTab" type="button" onclick="setMode('register')">Create
                    Account</button>
            </div>

            <div id="statusMessage" class="status-message"></div>

            <div id="loginPanel" class="auth-panel active">
                <h2>Welcome back</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="field-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="field-group">
                        <label for="loginPassword">Password</label>
                        <div class="field-inline">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password"
                                onclick="togglePassword('loginPassword', this)">Show</button>
                        </div>
                    </div>
                    <div class="table-actions">
                        <button type="submit">Login</button>
                    </div>
                </form>
            </div>

            <div id="registerPanel" class="auth-panel">
                <h2>Create your account</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="field-group">
                        <label for="registerName">Full Name</label>
                        <input type="text" id="registerName" placeholder="Alyssa Balest" required>
                    </div>
                    <div class="field-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" placeholder="name@school.edu" required>
                    </div>
                    <div class="field-group">
                        <label for="registerStudentId">Student ID</label>
                        <input type="text" id="registerStudentId" placeholder="e.g. 202600123" required>
                    </div>
                    <div class="field-group">
                        <label for="registerUsbcId">USBC ID</label>
                        <input type="text" id="registerUsbcId" placeholder="e.g. 987654321" required>
                    </div>
                    <div class="field-group">
                        <label for="registerPassword">Password</label>
                        <div class="field-inline">
                            <input type="password" id="registerPassword" placeholder="At least 8 characters" required
                                oninput="updatePasswordMeter()">
                            <button type="button" class="toggle-password"
                                onclick="togglePassword('registerPassword', this)">Show</button>
                        </div>
                        <div class="password-meter"><span id="passwordMeterBar"></span></div>
                    </div>
                    <div class="field-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                    </div>
                    <button type="submit">Create Account</button>
                </form>
            </div>
        </section>
    </div>
    <script>
        function setMode(mode) {
            const loginMode = mode === 'login';
            document.getElementById('loginTab').classList.toggle('active', loginMode);
            document.getElementById('registerTab').classList.toggle('active', !loginMode);
            document.getElementById('loginPanel').classList.toggle('active', loginMode);
            document.getElementById('registerPanel').classList.toggle('active', !loginMode);
            setStatus('');
        }

        function setStatus(message, type = '') {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = 'status-message' + (type ? ' ' + type : '');
        }

        function togglePassword(id, button) {
            const input = document.getElementById(id);
            const visible = input.type === 'text';
            input.type = visible ? 'password' : 'text';
            button.textContent = visible ? 'Show' : 'Hide';
        }

        function updatePasswordMeter() {
            const value = document.getElementById('registerPassword').value;
            const bar = document.getElementById('passwordMeterBar');
            let score = 18;
            if (value.length >= 8) score = 42;
            if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score = 64;
            if (/\d/.test(value) && /[^A-Za-z0-9]/.test(value)) score = 82;
            if (value.length >= 12) score = 100;

            bar.style.width = score + '%';
            bar.style.background = score < 50
                ? 'linear-gradient(135deg, #d1734a, #f0b45d)'
                : score < 80
                    ? 'linear-gradient(135deg, #d7a633, #8cb85d)'
                    : 'linear-gradient(135deg, #2f8f69, #59b48d)';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            await submitLogin(email, password);
        }

        async function submitLogin(email, password) {
            try {
                localStorage.removeItem('bowlerProfile');
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    setStatus(data.message || 'Login failed.', 'error');
                    return;
                }

                localStorage.setItem('bowlerProfile', JSON.stringify({
                    email: data.user.email,
                    name: data.user.name || email.split('@')[0],
                    role: data.user.role
                }));
                setStatus('Login successful. Redirecting...', 'success');
                window.location.href = data.user.role === 'coach'
                    ? `/admin?refresh=${Date.now()}`
                    : `/user-profile?refresh=${Date.now()}`;
            } catch (error) {
                setStatus('Login could not reach the app server. Start the project with `node server.js` and open `http://localhost:3000`.', 'error');
                return;
            }
        }

        async function demoCoachLogin() {
            document.getElementById('loginEmail').value = 'o.l.farwell@msmary.edu';
            document.getElementById('loginPassword').value = 'Coach123!';
            try {
                localStorage.removeItem('bowlerProfile');
                const res = await fetch('/demo-coach-login', { method: 'POST' });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    setStatus(data.message || 'Coach login failed.', 'error');
                    return;
                }
                localStorage.setItem('bowlerProfile', JSON.stringify({
                    email: data.user.email,
                    name: data.user.name,
                    role: data.user.role
                }));
                window.location.href = `/admin?refresh=${Date.now()}`;
            } catch (error) {
                setStatus('Coach login could not reach the app server. Start the project with `node server.js` and open `http://localhost:3000`.', 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const studentId = document.getElementById('registerStudentId').value.trim();
            const usbcId = document.getElementById('registerUsbcId').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                setStatus('Passwords do not match.', 'error');
                return;
            }

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, studentId, usbcId, password })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    setStatus(data.message || 'Could not create account.', 'error');
                    return;
                }

                document.getElementById('loginEmail').value = data.user.email;
                document.getElementById('loginPassword').value = password;
                setMode('login');
                setStatus('Account created. You can sign in now.', 'success');
            } catch (error) {
                setStatus('Account creation could not reach the app server. Start the project with `node server.js` and open `http://localhost:3000`.', 'error');
                return;
            }
        }

        const prefilledEmail = new URLSearchParams(window.location.search).get('email');
        if (prefilledEmail) {
            document.getElementById('loginEmail').value = prefilledEmail;
            document.getElementById('registerEmail').value = prefilledEmail;
        }

        fetch('/logout', { method: 'POST' }).catch(() => { });
        updatePasswordMeter();
    </script>
</body>

</html>
