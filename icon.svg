<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Mount Bowling Logo</title>
  <desc id="desc">A custom Mount Bowling logo featuring mountains, a bowling ball, and team wordmark.</desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4efe3"/>
      <stop offset="100%" stop-color="#d7e7ef"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0c5f7b"/>
      <stop offset="100%" stop-color="#083f56"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0bc62"/>
      <stop offset="100%" stop-color="#b78e37"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" rx="64" fill="url(#sky)"/>

  <circle cx="320" cy="238" r="150" fill="#ffffff" opacity="0.96"/>
  <circle cx="320" cy="238" r="142" fill="none" stroke="#0b5c7a" stroke-width="10"/>

  <path d="M183 304 260 194l58 82 55-63 85 91Z" fill="url(#ridge)"/>
  <path d="M214 304 277 220l38 55 47-52 64 81Z" fill="#2c7d97" opacity="0.92"/>

  <circle cx="442" cy="200" r="46" fill="#102c3e"/>
  <circle cx="427" cy="186" r="6.5" fill="#ffffff"/>
  <circle cx="449" cy="178" r="6.5" fill="#ffffff"/>
  <circle cx="454" cy="201" r="6.5" fill="#ffffff"/>

  <g transform="translate(156 334)">
    <rect x="0" y="0" width="328" height="118" rx="24" fill="#ffffff" opacity="0.96"/>
    <rect x="0" y="0" width="328" height="118" rx="24" fill="none" stroke="#0b5c7a" stroke-width="6"/>
    <text x="164" y="48" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#0b5c7a">MOUNT</text>
    <text x="164" y="89" text-anchor="middle" font-family="Iowan Old Style, Palatino Linotype, serif" font-size="46" font-weight="700" letter-spacing="2" fill="#000000">BOWLING</text>
  </g>

  <g transform="translate(118 474)">
    <path d="M0 32h138" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M266 32h138" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <text x="202" y="39" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#8f6d1f">WOMEN'S TEAM</text>
  </g>
</svg>
