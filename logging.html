<!DOCTYPE html>
<html>

<head>
    <title>PinPal Pro - Integrated</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="mount-icon-192.png">
    <meta name="theme-color" content="#0b5c7a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PinPoint Bowling">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <script src="pwa.js"></script>
    <script src="app-shell.js"></script>
    <style>
        body.logging-page {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logging-shell {
            width: min(100%, 1120px);
            display: grid;
            gap: 24px;
        }

        .global-nav {
            width: min(100%, 1120px);
            display: flex;
            justify-content: flex-start;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(11, 92, 122, 0.08);
            color: var(--text);
            font-weight: 700;
            box-shadow: var(--shadow-md);
        }

        .container,
        #dashboardView,
        #gameView {
            width: 100%;
        }

        .card,
        .scoreboard-card,
        .session-header {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.52);
            box-shadow: var(--shadow-lg);
            border-radius: 28px;
            padding: 28px;
        }

        .dashboard-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .max-header {
            background: linear-gradient(135deg, #123750, #0b5c7a);
            color: white;
            padding: 24px;
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 18px 36px rgba(11, 92, 122, 0.22);
        }

        .header-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            opacity: 1;
            color: #ffffff;
        }

        .max-val {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
        }

        .ball-chip {
            display: inline-flex;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.24);
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffffff;
        }

        .frame-label {
            margin-top: 8px;
            font-weight: 700;
            color: #000000;
        }

        #loggerInterface {
            margin-bottom: 24px;
        }

        #pinArea {
            display: grid;
            gap: 26px;
        }

        .pin-container {
            display: grid;
            justify-content: center;
            gap: 12px;
            margin: 8px 0 0;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .pin {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid rgba(11, 92, 122, 0.18);
            background: linear-gradient(135deg, #ffffff, #eef6fa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            box-shadow: 0 10px 18px rgba(18, 36, 51, 0.12);
            transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
        }

        .pin:hover {
            transform: translateY(-2px);
        }

        .pin.knocked {
            background: linear-gradient(135deg, #b4cad6, #dbe7ee);
            color: var(--text);
            border-color: transparent;
            box-shadow: none;
        }

        .controls {
            display: grid;
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn {
            padding: 15px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 16px;
        }

        .btn-strike {
            background: linear-gradient(135deg, #3e4669, #233149);
            color: white;
        }

        .btn-confirm,
        .btn-new {
            background: linear-gradient(135deg, #0f6a89, #083f56);
            color: white;
            box-shadow: 0 14px 28px rgba(8, 63, 86, 0.26);
        }

        .btn-dashboard,
        .btn-outline {
            background: rgba(11, 92, 122, 0.08);
            color: var(--text);
            box-shadow: none;
        }

        .btn-new,
        .btn-outline {
            width: 100%;
        }

        .history-table {
            table-layout: auto;
        }

        .scoreboard-wrap {
            overflow-x: auto;
        }

        .scoreboard {
            table-layout: fixed;
            min-width: 760px;
        }

        .scoreboard th {
            color: #000000;
        }

        .score-box {
            font-size: 0.92rem;
            font-weight: 800;
            color: #000000;
            margin-bottom: 8px;
        }

        .running-total {
            font-size: 1.05rem;
            color: #000000;
            font-weight: 800;
        }

        #grandTotal {
            font-weight: 800;
            font-size: 1.4rem;
            vertical-align: middle;
            background: rgba(11, 92, 122, 0.08);
            color: #000000;
        }

        #finalScoreArea {
            display: none;
            text-align: center;
        }

        #finalScoreArea .btn {
            width: 100%;
            margin-top: 12px;
        }

        #gameView,
        #dashboardView {
            display: none;
        }

        .active {
            display: block !important;
        }

        @media (max-width: 720px) {

            .card,
            .scoreboard-card,
            .session-header {
                padding: 20px;
            }

            .max-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .pin {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body class="logging-page">
    <div class="logging-shell">
        <div class="container">
            <div id="dashboardView" class="active">
                <div class="session-header">
                    <div class="dashboard-heading">
                        <div>
                            <span class="eyebrow">Game Logging</span>
                            <h2>PinPal Sessions</h2>
                        </div>
                        <div class="pill" id="historySummary">0 sessions tracked</div>
                    </div>
                    <button class="btn btn-new" onclick="showGame()">+ Start New Game</button>
                </div>
                <div class="card">
                    <h3>Recent History</h3>
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Score</th>
                                <th>Clean</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                    <button class="btn btn-outline" onclick="clearHistory()">Clear Data</button>
                </div>
            </div>

            <div id="gameView">
                <div class="nav-bar">
                    <button class="btn btn-dashboard" onclick="showDashboard()">← PinPal History</button>
                </div>

                <div class="max-header">
                    <div>
                        <span class="header-label">Max Possible</span>
                        <div id="maxPossibleDisplay" class="max-val">300</div>
                    </div>
                    <div style="text-align: right;">
                        <span id="ballLabel" class="ball-chip">Ball 1</span>
                        <div id="displayFrame" class="frame-label">Frame 1</div>
                    </div>
                </div>

                <div id="loggerInterface" class="card">
                    <div id="pinArea">
                        <div class="pin-container">
                            <div class="row">
                                <div class="pin" id="p7" onclick="togglePin(7)">7</div>
                                <div class="pin" id="p8" onclick="togglePin(8)">8</div>
                                <div class="pin" id="p9" onclick="togglePin(9)">9</div>
                                <div class="pin" id="p10" onclick="togglePin(10)">10</div>
                            </div>
                            <div class="row">
                                <div class="pin" id="p4" onclick="togglePin(4)">4</div>
                                <div class="pin" id="p5" onclick="togglePin(5)">5</div>
                                <div class="pin" id="p6" onclick="togglePin(6)">6</div>
                            </div>
                            <div class="row">
                                <div class="pin" id="p2" onclick="togglePin(2)">2</div>
                                <div class="pin" id="p3" onclick="togglePin(3)">3</div>
                            </div>
                            <div class="row">
                                <div class="pin" id="p1" onclick="togglePin(1)">1</div>
                            </div>
                        </div>
                        <div class="controls">
                            <button id="strikeBtn" class="btn btn-strike" onclick="quickStrike()">STRIKE (X)</button>
                            <button id="nextBtn" class="btn btn-confirm" onclick="submitBall()">Confirm Throw</button>
                        </div>
                    </div>
                    <div id="finalScoreArea"></div>
                </div>

                <div class="scoreboard-card">
                    <div class="scoreboard-wrap">
                        <table class="scoreboard">
                            <tr>
                                <th>1</th>
                                <th>2</th>
                                <th>3</th>
                                <th>4</th>
                                <th>5</th>
                                <th>6</th>
                                <th>7</th>
                                <th>8</th>
                                <th>9</th>
                                <th>10</th>
                                <th>Total</th>
                            </tr>
                            <tr>
                                <td id="f1">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f2">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f3">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f4">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f5">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f6">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f7">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f8">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f9">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="f10">
                                    <div class="score-box"></div>
                                    <div class="running-total"></div>
                                </td>
                                <td id="grandTotal">0</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let frame = 1, ball = 1, rollData = [], displayData = Array(11).fill(""), firstBallPins = 0, currentUser = null;

        function getLegacyStorageKey() {
            return currentUser ? `bowlingHistory:${currentUser.email}` : 'bowlingHistory';
        }

        function readLegacyGames() {
            if (!currentUser) return [];
            const scoped = JSON.parse(localStorage.getItem(getLegacyStorageKey()) || 'null');
            const fallback = JSON.parse(localStorage.getItem('bowlingHistory') || '[]');
            const raw = scoped || fallback;
            return raw.map((game, index) => ({
                id: game.id || `legacy_${index}_${game.date}`,
                date: game.date,
                score: game.score,
                clean: game.clean,
                summary: game.summary || { strikes: 0, spares: 0, opens: 0 },
                source: 'local'
            }));
        }

        function writeLegacyGames(games) {
            if (!currentUser) return;
            localStorage.setItem(getLegacyStorageKey(), JSON.stringify(games));
            localStorage.removeItem('bowlingHistory');
        }

        function normalizeServerGame(game) {
            return {
                id: game.id,
                date: game.date,
                score: game.score,
                clean: game.clean,
                summary: game.summary || { strikes: 0, spares: 0, opens: 0 },
                source: 'server'
            };
        }

        function showGame() {
            resetCurrentGame();
            document.getElementById('dashboardView').classList.remove('active');
            document.getElementById('gameView').classList.add('active');
        }

        function showDashboard() {
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('dashboardView').classList.add('active');
            updateHistoryUI();
        }

        function resetCurrentGame() {
            frame = 1; ball = 1; rollData = []; displayData = Array(11).fill(""); firstBallPins = 0;
            resetPins();
            // Restore visibility of pins and hide final score
            document.getElementById('pinArea').style.display = 'block';
            document.getElementById('finalScoreArea').style.display = 'none';
            document.querySelectorAll('.score-box, .running-total').forEach(el => el.innerText = "");
            document.getElementById('grandTotal').innerText = "0";
            document.getElementById('maxPossibleDisplay').innerText = "300";
            updateUI();
        }

        function togglePin(id) { document.getElementById('p' + id).classList.toggle('knocked'); }
        function quickStrike() { document.querySelectorAll('.pin').forEach(p => p.classList.add('knocked')); submitBall(); }
        function resetPins() { document.querySelectorAll('.pin').forEach(p => p.classList.remove('knocked')); }

        function submitBall() {
            let totalKnocked = document.querySelectorAll('.pin.knocked').length;
            let currentHit = (ball === 1) ? totalKnocked : (totalKnocked - firstBallPins);
            if (frame === 10 && ball > 1 && firstBallPins === 10) currentHit = totalKnocked;

            if (ball === 1) {
                firstBallPins = currentHit; rollData.push(currentHit);
                if (frame < 10) {
                    if (currentHit === 10) { displayData[frame] = "X"; advanceFrame(); }
                    else { displayData[frame] = currentHit; ball = 2; updateUI(); }
                } else {
                    displayData[10] = (currentHit === 10 ? "X" : currentHit); ball = 2;
                    if (currentHit === 10) resetPins(); updateUI();
                }
            } else if (ball === 2) {
                rollData.push(currentHit);
                if (frame < 10) {
                    displayData[frame] += " | " + (totalKnocked === 10 ? "/" : currentHit); advanceFrame();
                } else {
                    let sym = (totalKnocked === 10 && firstBallPins < 10) ? "/" : (currentHit === 10 ? "X" : currentHit);
                    displayData[10] += " | " + sym;
                    if (totalKnocked >= 10) { ball = 3; resetPins(); updateUI(); } else endGame();
                }
            } else {
                rollData.push(totalKnocked); displayData[10] += " | " + (totalKnocked === 10 ? "X" : totalKnocked); endGame();
            }
            calculateScore();
        }

        function advanceFrame() { frame++; ball = 1; firstBallPins = 0; resetPins(); updateUI(); }
        function updateUI() {
            document.getElementById('displayFrame').innerText = "Frame " + frame;
            document.getElementById('ballLabel').innerText = "Ball " + ball;
            const sBtn = document.getElementById('strikeBtn');
            if (sBtn) sBtn.style.visibility = (ball === 1 || (frame === 10 && document.querySelectorAll('.pin.knocked').length === 0)) ? "visible" : "hidden";
        }

        function calculateScore() {
            let total = 0, rIdx = 0;
            for (let f = 1; f <= 10; f++) {
                let fScore = 0;
                if (f < 10) {
                    if (rollData[rIdx] === 10) {
                        fScore = 10 + (rollData[rIdx + 1] || 0) + (rollData[rIdx + 2] || 0);
                        rIdx++;
                    } else {
                        let b1 = rollData[rIdx] || 0;
                        let b2 = rollData[rIdx + 1] || 0;
                        fScore = b1 + b2;
                        if (b1 + b2 === 10) fScore += (rollData[rIdx + 2] || 0);
                        rIdx += 2;
                    }
                } else {
                    fScore = (rollData[rIdx] || 0) + (rollData[rIdx + 1] || 0) + (rollData[rIdx + 2] || 0);
                }
                if (displayData[f] !== "") {
                    total += fScore;
                    document.getElementById('f' + f).querySelector('.score-box').innerText = displayData[f];
                    document.getElementById('f' + f).querySelector('.running-total').innerText = total;
                }
            }
            document.getElementById('grandTotal').innerText = total;

            let sim = [...rollData];
            if (frame < 10 && ball === 2) sim.push(10 - firstBallPins);
            else if (frame === 10) { if (ball === 2) { sim.push(10); sim.push(10); } else if (ball === 3) sim.push(10); }
            while (sim.length < 21) sim.push(10);
            let maxT = 0, mIdx = 0;
            for (let f = 1; f <= 10; f++) {
                if (f < 10) {
                    if (sim[mIdx] === 10) { maxT += 10 + sim[mIdx + 1] + sim[mIdx + 2]; mIdx++; }
                    else { maxT += sim[mIdx] + sim[mIdx + 1]; if (sim[mIdx] + sim[mIdx + 1] === 10) maxT += sim[mIdx + 2]; mIdx += 2; }
                } else { maxT += sim[mIdx] + sim[mIdx + 1] + sim[mIdx + 2]; }
            }
            document.getElementById('maxPossibleDisplay').innerText = maxT;
        }

        function endGame() {
            calculateScore();
            const finalScore = document.getElementById('grandTotal').innerText;
            const clean = displayData.filter(d => d.toString().includes('X') || d.toString().includes('/')).length;
            const summary = buildSummary();
            const localEntry = {
                id: `local_${Date.now()}`,
                date: new Date().toLocaleDateString(),
                score: Number(finalScore),
                clean,
                summary: summarizeRolls(rollData),
                rolls: [...rollData]
            };
            writeLegacyGames([...readLegacyGames(), localEntry]);

            AppShell.fetchJson('/api/games', {
                method: 'POST',
                body: JSON.stringify({
                    score: Number(finalScore),
                    clean,
                    rolls: rollData,
                    label: `Game ${new Date().toLocaleDateString()}`
                })
            }).then(() => {
                document.getElementById('pinArea').style.display = 'none';
                const fsa = document.getElementById('finalScoreArea');
                fsa.style.display = 'block';
                fsa.innerHTML = `<h2>Final Score: ${finalScore}</h2><p>${summary}</p><button class="btn btn-confirm" style="width:100%" onclick="showDashboard()">Save and Close</button>`;
                updateHistoryUI();
            }).catch(() => {
                document.getElementById('pinArea').style.display = 'none';
                const fsa = document.getElementById('finalScoreArea');
                fsa.style.display = 'block';
                fsa.innerHTML = `<h2>Final Score: ${finalScore}</h2><p>${summary}</p><button class="btn btn-confirm" style="width:100%" onclick="showDashboard()">Save and Close</button>`;
                updateHistoryUI();
            });
        }

        function summarizeRolls(rolls) {
            const summary = buildRollSummary(rolls);
            return {
                strikes: summary.strikes,
                spares: summary.spares,
                opens: summary.opens
            };
        }

        function buildRollSummary(rolls) {
            let strikes = 0;
            let spares = 0;
            let opens = 0;
            let idx = 0;

            for (let frameIndex = 1; frameIndex <= 10; frameIndex++) {
                const first = rolls[idx] || 0;
                const second = rolls[idx + 1] || 0;
                if (frameIndex < 10) {
                    if (first === 10) {
                        strikes++;
                        idx += 1;
                    } else if (first + second === 10) {
                        spares++;
                        idx += 2;
                    } else {
                        opens++;
                        idx += 2;
                    }
                } else {
                    if (first === 10) strikes++;
                    else if (first + second === 10) spares++;
                    else opens++;
                }
            }

            return { strikes, spares, opens };
        }

        function buildSummary() {
            const strikes = rollData.filter((roll, index) => index < 12 && roll === 10).length;
            const firstBallAverage = rollData.filter((_, index) => index % 2 === 0).reduce((sum, roll) => sum + roll, 0) / Math.max(Math.ceil(rollData.length / 2), 1);
            return `Summary: ${strikes} strikes logged with a ${firstBallAverage.toFixed(1)} first-ball average.`;
        }

        async function updateHistoryUI() {
            const localGames = readLegacyGames();
            let serverGames = [];
            try {
                const data = await AppShell.fetchJson('/api/games');
                serverGames = data.games.map(normalizeServerGame);
            } catch (error) { }

            const combined = [...serverGames];
            localGames.forEach((game) => {
                const duplicate = combined.some((entry) => entry.date === game.date && Number(entry.score) === Number(game.score) && Number(entry.clean) === Number(game.clean));
                if (!duplicate) combined.push(game);
            });

            const hist = combined.slice().reverse();
            document.getElementById('historyBody').innerHTML = hist.map(g => `<tr><td>${g.date}</td><td><b>${g.score}</b><br><span class="muted">${g.summary?.strikes || 0} X / ${g.summary?.spares || 0} / / ${g.summary?.opens || 0} opens</span></td><td>${g.clean}/10</td></tr>`).join('') || '<tr><td colspan="3">No games logged yet</td></tr>';
            document.getElementById('historySummary').innerText = `${hist.length} session${hist.length === 1 ? '' : 's'} tracked`;
        }

        async function clearHistory() {
            if (confirm("Clear history?")) {
                writeLegacyGames([]);
                try {
                    await AppShell.fetchJson('/api/games', { method: 'DELETE' });
                } catch (error) { }
                updateHistoryUI();
            }
        }

        AppShell.init({ active: 'logging' }).then((user) => {
            currentUser = user;
            updateHistoryUI();
        });
    </script>
</body>

</html>
